<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087db8">

<title>BOSCH Ring Servis | Bursa Fabrikaları</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>
:root {
  --blue: #08618f;
  --blue2: #087db8;
  --ink: #202124;
  --muted: #777b80;
  --bg: #f1f1f6;
  --line: #e8e8ed;
  --green: #35b86a;
  --orange: #e58a00;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

.top {
  height: 96px;
  background: var(--blue2);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 max(22px, calc((100% - 1000px) / 2));
  font-size: 29px;
  font-weight: 300;
}

.wrap {
  max-width: 760px;
  margin: 28px auto;
  background: var(--bg);
  padding: 18px 18px 30px;
}

.rainbow {
  height: 7px;
  margin-bottom: 22px;
  background: linear-gradient(
    90deg,
    #005b8f,
    #00a3c7,
    #39a85b,
    #d4d51b,
    #f28c00,
    #e31c35,
    #92278f
  );
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 8px 22px;
}

.bosch {
  color: #d71920;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1px;
}

.brandline {
  height: 40px;
  border-left: 2px solid #c8c8cc;
}

.brandname {
  font-size: 22px;
  font-weight: 700;
}

.sub {
  margin-top: 2px;
  color: #8a8a8a;
  font-size: 15px;
  font-weight: 600;
}

.clock {
  margin-left: auto;
  padding: 11px 17px;
  background: #e5e5e9;
  border-radius: 30px;
  font-size: 18px;
  font-weight: 700;
  white-space: nowrap;
}

.dot {
  margin-right: 8px;
  color: var(--green);
}

.error {
  margin-top: 5px;
  color: #a35b00;
  font-size: 11px;
  text-align: center;
}

.panel {
  margin-bottom: 18px;
  padding: 18px;
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 8px 24px #182b4410;
}

.segment {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 22px;
  padding: 12px;
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 4px 15px #0000000a;
}

.segment button,
.factory button,
.day button {
  padding: 12px 17px;
  border: 0;
  border-radius: 15px;
  background: #f1f1f5;
  color: #36383c;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.segment button.active,
.day button.active {
  background: var(--blue);
  color: #fff;
}

.sectionhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 12px 3px 10px;
  color: #62656b;
  font-weight: 800;
}

.sectionhead strong {
  color: var(--blue);
}

.factory {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 22px;
  padding: 7px;
  background: #e5e5e9;
  border-radius: 22px;
}

.factory button {
  padding: 13px 4px;
  background: transparent;
  font-size: 18px;
}

.factory small {
  display: block;
  margin-top: 4px;
  color: #888;
  font-size: 12px;
}

.factory button.active {
  background: #fff;
  color: #171717;
  box-shadow: 0 4px 12px #0002;
}

.factory button.active small {
  color: var(--blue);
}

.routehead {
  display: flex;
  align-items: center;
  gap: 14px;
}

.busicon {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: #eaf3f9;
  border-radius: 22px;
  font-size: 34px;
}

.routeinfo {
  flex: 1;
}

.eyebrow {
  color: #8b8e92;
  font-size: 14px;
  font-weight: 800;
}

.route {
  margin-top: 3px;
  font-size: 24px;
  font-weight: 800;
}

.depart {
  text-align: right;
}

.depart span {
  display: block;
  color: #92959a;
  font-size: 14px;
  font-weight: 800;
}

.depart strong {
  color: var(--blue);
  font-size: 38px;
}

.countbox {
  margin-top: 20px;
  padding: 22px;
  background: #f2f6f9;
  border: 1px solid #d5e0e8;
  border-radius: 24px;
}

.countlabel {
  color: #666;
  font-weight: 700;
}

.countrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.count {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1px;
}

.trip {
  padding: 10px 16px;
  background: #fff;
  border: 1px solid #d8dce0;
  border-radius: 18px;
  color: #29465a;
  font-weight: 700;
}

.status {
  margin-top: 8px;
  color: var(--green);
  font-weight: 700;
}

.stops {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 22px;
}

.stop {
  padding: 11px 14px;
  background: #f0f0f4;
  border-radius: 15px;
  font-weight: 700;
}

.stop.first {
  background: var(--blue);
  color: #fff;
}

.stop.last {
  background: #e8f5e9;
  color: #387b43;
}

.arrow {
  color: #999;
}

.mapwrap {
  position: relative;
  height: 390px;
  overflow: hidden;
  background: #e9eef1;
  border-radius: 18px;
}

#ringMap {
  width: 100%;
  height: 100%;
}

.mapmeta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 2px 12px;
  color: #66717a;
  font-size: 13px;
}

.mapmeta b {
  color: var(--blue);
}

.maplegend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 10px;
  color: #69737b;
  font-size: 12px;
}

.maplegend span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  display: inline-block;
  background: var(--blue2);
  border-radius: 50%;
}

.legend-line {
  width: 18px;
  height: 3px;
  display: inline-block;
  background: var(--blue2);
}

.vehicle-marker {
  background: transparent;
  border: 0;
}

.van {
  width: 66px;
  height: 38px;
  filter: drop-shadow(0 2px 3px #0005);
}

.advice {
  font-size: 16px;
  line-height: 1.5;
}

.advice strong {
  color: var(--blue);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
}

.metric {
  padding: 12px;
  background: #f7f8fa;
  border-radius: 16px;
  text-align: center;
}

.metric span {
  display: block;
  color: #999;
  font-size: 12px;
  font-weight: 700;
}

.metric b {
  display: block;
  margin-top: 4px;
}

.day {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.day button {
  flex: 1;
}

.list {
  padding: 0;
  overflow: hidden;
}

.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-bottom: 1px solid #eee;
}

.row:last-child {
  border-bottom: 0;
}

.row.next {
  background: #eef6ff;
  border-left: 7px solid var(--blue);
}

.row.past {
  opacity: 0.48;
}

.timepill {
  min-width: 76px;
  padding: 10px 13px;
  background: #eaf3f9;
  border-radius: 14px;
  color: var(--blue);
  font-size: 20px;
  font-weight: 800;
  text-align: center;
}

.rowmain {
  flex: 1;
}

.rowroute {
  font-size: 19px;
  font-weight: 800;
}

.rowdesc {
  margin-top: 4px;
  color: #888;
  font-size: 14px;
}
